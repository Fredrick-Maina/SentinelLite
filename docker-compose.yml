version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinellite_postgres
    restart: always
    environment:
      POSTGRES_USER: sentinellite
      POSTGRES_PASSWORD: sentinellite_password
      POSTGRES_DB: sentinellite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinellite -d sentinellite_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinellite_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinellite:sentinellite_password@postgres:5432/sentinellite_db
      - ENVIRONMENT=production
      - SECRET_KEY=sentinellite-production-secret-key-change-me
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinellite_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
